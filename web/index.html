<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Телеграм-каналы · Облачный адвокат и Курированная жизнь</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <h1>Телеграм-каналы</h1>
    <p class="sub" id="channel-sub">Облачный адвокат · Курированная жизнь</p>
    <div class="search">
      <input id="search" type="search" placeholder="Поиск по постам…" autocomplete="off" aria-label="Поиск">
    </div>
    <div class="filters" id="filters"></div>
  </div>
</header>

<main class="wrap">
  <div id="status" class="status hidden"></div>
  <div id="feed" class="feed"></div>
  <nav id="pager" class="pager" aria-label="Страницы"></nav>
</main>

<footer class="site-foot"><div class="wrap">
  <p>Статический архив постов из Telegram, собирается автоматически из экспорта.
  Комментарии — из обсуждений под постами.</p>
</div></footer>

<script src="app.js"></script>
</body>
</html>
